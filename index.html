<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LARI TURUN - Hindari Jebakan & Bos</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:10px;font-size:18px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:10px;z-index:99}
#floorName{position:fixed;top:10px;right:10px;font-size:16px;font-weight:bold;color:#ff4444;z-index:99;background:rgba(0,0,0,.6);padding:8px;border-radius:10px}
#hpBarWrap{position:fixed;top:50px;left:10px;right:10px;z-index:99}
#hpText{font-size:22px;font-weight:bold;margin-bottom:5px;text-shadow:2px 2px 0 black}
#hpBarBg{width:100%;height:28px;background:#333;border:3px solid white;border-radius:15px;overflow:hidden}
#hpBar{width:100%;height:100%;background:linear-gradient(90deg,#00ff00,#aaff00);transition:width 0.2s}
#hpBar.low{background:linear-gradient(90deg,#ff0000,#ff6600)}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:99;align-items:flex-end}
#dpad{display:grid;grid-template-columns:60px 60px 60px;gap:5px}
#dpad button{width:60px;height:60px;font-size:24px;border-radius:15px;background:rgba(255,255,255,.2);color:white;border:2px solid white;touch-action:none}
#dpad button:active{background:#00ff88;color:black}
#downBtn{width:80px;height:80px;font-size:14px;border-radius:50%;background:#00aaff;color:white;border:2px solid white;font-weight:bold;touch-action:none}
#celebration{position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:999;text-align:center;background:rgba(0,0,0,.7)}
#celebration.show{display:flex;animation:flash 0.5s 6}
@keyframes flash{0%{background:rgba(255,215,0,.6)}50%{background:rgba(0,0,0,.7)}100%{background:rgba(255,215,0,.6)}}
#celebTitle{font-size:42px;font-weight:900;color:#FFD700;text-shadow:4px 4px 0 #ff0000, -2px -2px 0 #000;animation:pop 0.5s infinite alternate}
@keyframes pop{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.15) rotate(2deg)}}
#celebSub{font-size:22px;margin-top:10px;color:white;text-shadow:2px 2px 0 black}
#celebBtn{margin-top:20px;padding:15px 30px;font-size:20px;font-weight:bold;background:#00ff88;border:none;border-radius:20px}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:998;display:none}
</style>
</head>
<body>
<div id="hud">LANTAI: <span id="lantai">1</span></div>
<div id="floorName">Lantai 1 - Gerbang Awal</div>
<div id="hpBarWrap">
  <div id="hpText">❤️ HP: <span id="hp">100</span> / 100</div>
  <div id="hpBarBg"><div id="hpBar"></div></div>
</div>
<canvas id="game"></canvas>
<canvas id="confettiCanvas"></canvas>
<div id="celebration">
  <div id="celebTitle">🎉 SELAMAT! 🎉</div>
  <div id="celebSub"></div>
  <button id="celebBtn" onclick="tutupCelebration()">LANJUT MAIN ▶️</button>
</div>
<div id="controls">
  <div id="dpad">
    <div></div><button id="btnUp">⬆️</button><div></div>
    <button id="btnLeft">⬅️</button><button id="btnDown">⬇️</button><button id="btnRight">➡️</button>
  </div>
  <button id="downBtn">TURUN<br>▼</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const confetti=document.getElementById('confettiCanvas');
const cctx=confetti.getContext('2d');
confetti.width=window.innerWidth; confetti.height=window.innerHeight;
let confettiParts=[];
function mulaiConfetti(warnaApi=false){
  confetti.style.display='block'; confettiParts=[];
  let warna = warnaApi ? ['#ff0000','#ff6600','#FFD700','#ff00ff','#ffffff'] : ['#FFD700','#00ff88','#00aaff','#ff00ff','#ffffff'];
  for(let i=0;i<150;i++){ confettiParts.push({x:Math.random()*confetti.width,y:-20-Math.random()*300,vx:(Math.random()-0.5)*6,vy:2+Math.random()*5,s:5+Math.random()*8,c:warna[Math.floor(Math.random()*warna.length)],r:Math.random()*360}); }
  animasiConfetti();
}
function animasiConfetti(){
  if(confettiParts.length===0) return;
  cctx.clearRect(0,0,confetti.width,confetti.height);
  confettiParts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=5; cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r*Math.PI/180); cctx.fillStyle=p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); cctx.restore(); });
  confettiParts=confettiParts.filter(p=>p.y<confetti.height+20);
  if(confettiParts.length>0) requestAnimationFrame(animasiConfetti); else confetti.style.display='none';
}
