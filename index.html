<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial;color:white;touch-action:none}

#dpad button{width:60px;height:60px;font-size:24px;border-radius:15px;background:rgba(255,255,255,.25);color:white;border:2px solid white;touch-action:none}
#dpad button:active{background:#00ff88;color:black}
#downBtn{width:80px;height:80px;font-size:14px;border-radius:50%;background:#00aaff;color:white;border:2px solid white;font-weight:bold;touch-action:none}
#startScreen{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
#startScreen h1{font-size:44px;color:#FFD700;margin:0;line-height:1.1}
#startBtn{margin-top:30px;padding:18px 35px;font-size:24px;font-weight:bold;background:#ff4444;border:none;border-radius:20px;color:white}
#celebration{position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:999;text-align:center;background:rgba(0,0,0,.7)}
#celebration.show{display:flex}
#celebTitle{font-size:38px;font-weight:900;color:#FFD700}
#celebSub{font-size:20px;margin-top:10px}
#celebBtn{margin-top:20px;padding:15px 30px;font-size:20px;font-weight:bold;background:#00ff88;border:none;border-radius:20px}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:998;display:none}
