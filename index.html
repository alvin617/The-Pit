<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE PIT</title><style>*{margin:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}.hero h1{font-size:60px;color:red;letter-spacing:8px}.hero p{color:#ccc;margin:12px 0 20px}.btn{background:red;color:#fff;border:0;padding:16px 30px;font-size:18px;font-weight:bold;border-radius:10px}#g{display:none;padding:12px;max-width:480px;margin:auto}.hud{display:flex;justify-content:space-between;background:#1a1a1a;padding:10px;border-radius:10px;margin-bottom:10px}canvas{width:100%;height:500px;background:#000;border:2px solid red;border-radius:12px}.ctl{display:flex;gap:8px;margin-top:10px}.ctl button{flex:1;padding:16px;font-size:22px;background:#222;color:#fff;border:1px solid #444;border-radius:10px}</style></head><body>
<div class="hero" id="home"><div style="font-size:40px">🕳️</div><h1>THE PIT</h1><p>Game survival paling menegangkan.<br>Kamu terjebak di dasar jurang.<br>Berani turun sejauh apa?</p><button class="btn" onclick="mulai()">▶ MAIN SEKARANG</button><p style="margin-top:20px;color:#888">🕳️ 100+ Lantai | 🔦 Kumpulkan Loot | 💀 Bertahan Hidup</p></div>
<div id="g"><div class="hud"><span>🕳️ <b id="d">0</b>m</span><span>⭐ <b id="s">0</b></span><span>❤️ <b id="h">100</b></span></div><canvas id="cv" width="400" height="500"></canvas><div id="m" style="margin-top:8px;color:yellow;font-weight:bold">Mendarat di platform coklat! Ambil 🔦 🍗, hindari 💀</div><div class="ctl"><button ontouchstart="L=1" ontouchend="L=0">◀</button><button onclick="lompat()">⬆ LOMPAT</button><button ontouchstart="R=1" ontouchend="R=0">▶</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="ulang()">🔄 MAIN LAGI</button></div>
<script>let cv=document.getElementById('cv'),x=cv.getContext('2d'),W=400,H=500,p,pl,it,sk,dp,hp,over,L=0,R=0,raf;function init(){p={x:180,y:80,w:28,h:28,vx:0,vy:0,g:false};pl=[];it=[];sk=0;dp=0;hp=100;over=false;for(let i=0;i<7;i++)buat(i*75+60);document.getElementById('m').textContent='Mendarat di platform coklat! Ambil 🔦 🍗, hindari 💀';upd()}function buat(y){let w=70+Math.random()*60,a=Math.random()*(W-w);pl.push({x:a,y:y,w:w,h:14});if(Math.random()<.6)it.push({x:a+w/2-10,y:y-22,t:Math.random()<.4?'🔦':Math.random()<.5?'🍗':'💀'})}function mulai(){document.getElementById('home').style.display='none';document.getElementById('g').style.display='block';init();loop()}function ulang(){cancelAnimationFrame(raf);init();loop()}function lompat(){if(p.g){p.vy=-13;p.g=false}}function upd(){document.getElementById('d').textContent=dp;document.getElementById('s').textContent=sk;document.getElementById('h').textContent=hp}function loop(){if(over)return;if(L)p.vx=-5;else if(R)p.vx=5;else p.vx*=0.8;p.x+=p.vx;p.vy+=0.6;p.y+=p.vy;if(p.x<0)p.x=0;if(p.x>W-p.w)p.x=W-p.w;p.g=false;for(let q of pl)q.y-=1.2;for(let q of it)q.y-=1.2;dp++;if(dp%75==0)buat(H+10);pl=pl.filter(q=>q.y>-20);it=it.filter(q=>q.y>-20);for(let q of pl){if(p.vy>0&&p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>q.y&&p.y+p.h<q.y+18){p.y=q.y-p.h;p.vy=0;p.g=true}}for(let i=it.length-1;i>=0;i--){let q=it[i];if(Math.abs(p.x-q.x)<28&&Math.abs(p.y-q.y)<28){if(q.t=='🔦'){sk+=10;document.getElementById('m').textContent='🔦 Senter! +10 Poin'}if(q.t=='🍗'){hp=Math.min(100,hp+20);document.getElementById('m').textContent='🍗 Makan! +20 HP'}if(q.t=='💀'){hp-=30;document.getElementById('m').textContent='💀 Jebakan! -30 HP'}it.splice(i,1);upd()}}if(p.y>H||hp<=0){over=true;document.getElementById('m').textContent='💀 GAME OVER! Kedalaman '+dp+'m | Skor '+sk+' - Pencet MAIN LAGI';gambar();return}upd();gambar();raf=requestAnimationFrame(loop)}function gambar(){x.clearRect(0,0,W,H);x.fillStyle='#111';x.fillRect(0,0,10,H);x.fillRect(W-10,0,10,H);for(let q of pl){x.fillStyle='#8B4513';x.fillRect(q.x,q.y,q.w,q.h)}x.font='20px Arial';x.textAlign='center';for(let q of it)x.fillText(q.t,q.x+10,q.y+16);x.font='26px Arial';x.fillText('🧍',p.x+14,p.y+24)}</script></body></html>
